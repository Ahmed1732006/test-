        // ════════════════════════════════════════════════════════════════════

        let _uid = 1;

        function uid() { return 'id' + (_uid++); }

        function findSection(id) { return state.sections.find(s => s.id === id); }

        function findSub(sectionId, subId) {
            const sec = findSection(sectionId);
            if (!sec) return null;
            return sec.subs.find(s => s.id === subId);
        }

        function findItem(sectionId, subId, itemId) {
            const sub = findSub(sectionId, subId);
            if (!sub) return null;
            return sub.items.find(i => i.id === itemId);
        }

        let currentAuthUser = null;

        async function getCurrentAuthUser(){
            if(currentAuthUser) return currentAuthUser;
            const {data,error}=await sb.auth.getUser();
            if(error) throw error;
            if(!data?.user) throw new Error('انتهت جلسة الدخول.');
            currentAuthUser=data.user;
            return currentAuthUser;
        }

        // ════════════════════════════════════════════════════════════════════
        // SUPABASE / AUTH
        // ════════════════════════════════════════════════════════════════════
        const SUPABASE_URL = "https://clobfjrjhdysmqhbwzlc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_LEFYVl0Y8VOnMIbBZev1Vg_0pYSMWpv";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let authReady = false;

        function isAdmin() { return isRealAdmin() && !state.viewAsMember; }
        function isOwnerAdmin() { return !!state.user?.isOwnerAdmin; }

        function go(view, opts = {}) {
            state.view = view;
            if (opts.sectionId !== undefined) state.currentSectionId = opts.sectionId;
            if (opts.subId !== undefined) state.currentSubId = opts.subId;

            window.scrollTo({ top: 0, behavior: 'smooth' });

        function publicStorageUrl(bucket, path) {
            if (!path) return null;
            if (/^https?:\/\//i.test(path) || /^data:/i.test(path)) return path;
            const { data } = sb.storage.from(bucket).getPublicUrl(path);
            return data?.publicUrl || path;
        }

        async function loadData() {
            const [catsRes, subsRes, matsRes, catAccessRes, subAccessRes, matAccessRes] = await Promise.all([
                sb.from('categories').select('*').eq('is_active', true).order('sort_order', {ascending:true}),
                sb.from('subcategories').select('*').order('sort_order', {ascending:true}),
                sb.from('materials').select('*').eq('is_active', true).order('sort_order', {ascending:true}),
                isAdmin() ? sb.from('category_user_access').select('*') : Promise.resolve({data:[],error:null}),
                isAdmin() ? sb.from('subcategory_user_access').select('*') : Promise.resolve({data:[],error:null}),
                isAdmin() ? sb.from('material_user_access').select('*') : Promise.resolve({data:[],error:null})
            ]);
            if (catsRes.error) throw catsRes.error;
            if (subsRes.error) throw subsRes.error;
            if (matsRes.error) throw matsRes.error;
            if (catAccessRes.error) throw catAccessRes.error;
            if (subAccessRes.error) throw subAccessRes.error;
            if (matAccessRes.error) throw matAccessRes.error;

            const cats = catsRes.data || [], subs = subsRes.data || [], mats = matsRes.data || [];
            const catAccessRows = catAccessRes.data || [], subAccessRows = subAccessRes.data || [], accessRows = matAccessRes.data || [];

                id: String(c.id), dbId: c.id, name: c.name || 'بدون اسم',
                icon: c.icon || 'fa-folder',
                image: publicStorageUrl('categories', c.image_path || c.image_url || c.image_path_public),
                visibilityMode: c.visibility_mode || 'all', ownerId: c.owner_id || null, textBold: c.text_bold !== false, textColor: c.text_color || '#111827',

        function safeFileName(name){
            return String(name||'file').replace(/[^\w.\-\u0600-\u06FF ]+/g,'_').replace(/\s+/g,'_').slice(0,120);
        }

        async function uploadFile(bucket,file,folder='uploads'){
            if(!file) return null;
            if(!(file instanceof File)) throw new Error('ملف الرفع غير صالح.');
            // Keep Storage object keys ASCII-only; Unicode filenames can be rejected
            // by Supabase Storage as an invalid key.
            const originalName=String(file.name||'file');
            const ext=(originalName.match(/\.([A-Za-z0-9]{1,12})$/)||[])[1]||'bin';
            const cleanFolder=String(folder||'uploads').replace(/[^A-Za-z0-9._-]/g,'_');
            const path=`${cleanFolder}/${crypto.randomUUID()}.${ext.toLowerCase()}`;
            const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,cacheControl:'3600',contentType:file.type||'application/octet-stream'});
            if(error) throw new Error(`فشل رفع الملف إلى Storage: ${error.message}`);
            return path;
        }

        async function uploadImageIfNeeded(dataUrlOrUrl,bucket,folder,name='image.png',fileObj=null){
            if(fileObj) return uploadFile(bucket,fileObj,folder);
            return dataUrlOrUrl||null;
        }

        async function downloadMaterial(item) {
            const path = item?.filePath || item?.fileData;
            if (!path) return showToast('لا يوجد ملف لهذه المادة', 'error');
            if (/^https?:\/\//i.test(path)) {
                window.open(path, '_blank', 'noopener');
                return;
            }
            try {
                const { data, error } = await sb.storage.from('materials').createSignedUrl(path, 300);
                if (error) throw error;
                window.open(data.signedUrl, '_blank', 'noopener');
            } catch (e) {
                showToast(e.message || 'تعذّر تحميل الملف', 'error');
            }
        }

        function downloadFile(data, name) {
            if (!data) return;
            const link = document.createElement('a');
            link.href = data;
            link.download = name || 'download';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + type;
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => {
                el.classList.remove('show');
            }, 3000);
        }

        function render() {
            const app = document.getElementById('app');

            if (state.view === 'login') {

        // ─── Home ───

        function renderHome() {
            const sections = state.sections;
            const isAdminRole = isAdmin();

            let cards = sections.map((s, i) => {
                const delay = 'stagger-' + ((i % 7) + 1);
                const hasImage = s.image && s.image.length > 0;
                const imgStyle = hasImage ? `background-image:url(${s.image})` : '';

                    <button class="danger" data-act="delete-section" data-section="${s.id}" title="حذف" data-stop-prop="1"><i class="fas fa-trash"></i></button>

                return `
              <div class="box-card anim-fade-up ${delay}" data-act="open-section" data-section="${s.id}">
                ${adminActions}
                <div class="card-image ${placeholderClass}" style="${imgStyle}">

        // ─── Admin: User Management (inside 2.html) ───

        function escapeHtml(value){
            return String(value ?? '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        const PROFILE_TITLE_PRESETS = [
            'قمر','نجمة','وردة','ميوش','ميموية','صحبي','صحبتي','صديقي','صديقتي','أمير','ملكة',
            'نجم','كوكب','لؤلؤة','فراشة','سكر','عسل','برنس','برنسيسة','شطور','جدع','باشا','باشمهندس',
            'فنان','فنانة','مبدع','مبدعة','أسطورة','روح حلوة','الجامد','الجامدة','الرايق','الرايقة',
            'الكابتن','الزعيم','الملكة','الأمير','نجم اليوم','صاحبنا','صاحبتنا','رفيق','رفيقة','غالي','غالية'
        ];
        function titleList(value){
            if(Array.isArray(value)) return value.map(v=>String(v).trim()).filter(Boolean);
            return String(value||'').split(/[,،|]/).map(v=>v.trim()).filter(Boolean);
        }
        function visibleTitleList(u){
            // The subset of a user's titles that shows "up top" (header, next
            // to their name). Inside the profile page and inside the welcome
            // greeting, ALL of profile_title always show regardless of this.
            // visible_titles === null/undefined means "never customized yet"
            // → show everything (keeps old behaviour until someone picks).
            const all=titleList(u?.profile_title);
            if(u?.visible_titles==null) return all;
            const chosen=new Set(titleList(u.visible_titles));
            return all.filter(t=>chosen.has(t));
        }
        function renderVisibleTitlePicker(u, opts={}){
            const all=titleList(u?.profile_title);
            if(!all.length) return `<p class="access-help" style="margin-top:6px">لسه معندكش ألقاب مضافة، اختار لقب أو أكتر الأول.</p>`;
            const visible=new Set(visibleTitleList(u));
            const prefix=opts.idPrefix||'vt';
            return `<div class="title-picker" id="${prefix}-picker" data-user-id="${escapeHtml(u.id||'')}">
                <div class="title-picker-grid">${all.map(t=>`<button type="button" class="title-option ${visible.has(t)?'active':''}" data-act="visible-title-toggle" data-visible-title="${escapeHtml(t)}">✦ ${escapeHtml(t)}</button>`).join('')}</div>
                <small style="display:block;margin-top:7px;color:var(--text-muted)">اللي مفعّل هنا هو اللي هيظهر فوق جنب الاسم. جوه الملف الشخصي وفي رسالة الترحيب هتفضل كل الألقاب ظاهرة زي ما هي.</small>
            </div>`;
        }
        function renderTitleChips(value, cls='title-chips'){
            const arr=titleList(value);
            return arr.length ? `<div class="${cls}">${arr.map(t=>`<span class="title-chip">✦ ${escapeHtml(t)}</span>`).join('')}</div>` : '';
        }
        function renderTitlePicker(value){
            const selected=titleList(value);
            return `<div class="title-picker">
                <div class="title-picker-grid">${PROFILE_TITLE_PRESETS.map(t=>`<button type="button" class="title-option ${selected.includes(t)?'active':''}" data-act="title-option" data-title-option="${escapeHtml(t)}">✦ ${escapeHtml(t)}</button>`).join('')}</div>
                <div class="field" style="margin-top:10px;margin-bottom:0"><label>لقب إضافي من عندك</label><div style="display:flex;gap:8px"><input id="um-custom-title" type="text" placeholder="مثال: قمر 007 أو صاحب المذاكرة..." value=""><button type="button" class="btn-save" style="min-width:90px" data-act="title-add-custom">إضافة</button></div></div>
                <div id="um-selected-titles" class="title-selected">${selected.map(t=>`<button type="button" class="title-remove" data-act="title-remove" data-title-remove="${escapeHtml(t)}">✕ ${escapeHtml(t)}</button>`).join('')}</div>
                <input type="hidden" id="um-edit-title" value="${escapeHtml(selected.join('، '))}">
                <small style="display:block;margin-top:7px;color:var(--text-muted)">اختار لقب أو أكتر؛ هتظهر الألقاب جنب بعض. وتقدر تضيف لقب من اختيارك.</small>
            </div>`;
        }
        function syncSelectedTitles(){
            const hidden=document.getElementById('um-edit-title');
            const box=document.getElementById('um-selected-titles');
            if(!hidden||!box) return [];
            const arr=[...box.querySelectorAll('[data-title-remove]')].map(b=>b.getAttribute('data-title-remove')).filter(Boolean);
            hidden.value=arr.join('، ');
            return arr;
        }
        function userDisplayName(u){
            const n=(u?.full_name||u?.name||'').trim();
            return n || 'الاسم غير مسجل';
        }

        function userDisplayPhone(u){
            const p=(u?.phone_number||u?.phone||'').trim();
            return p || 'التليفون غير مسجل';
        }

        function userStatus(u){
            if(u?.role==='admin'||u?.role==='super_admin') return {key:'admin',label:'أدمن ذهبي',tone:'violet'};
            if(u?.role==='moderator') return {key:'moderator',label:'مشرف',tone:'blue'};
            if(u?.status==='revoked') return {key:'revoked',label:'مرفوض / موقوف',tone:'red'};
            if(u?.status==='pending') return {key:'pending',label:'في انتظار الموافقة',tone:'amber'};
            if(u?.account_type==='temporary'||u?.is_temporary===true||u?.must_change_credentials===true)
                return {key:'temporary',label:'حساب مؤقت',tone:'blue'};
            return {key:'approved',label:'عضو مقبول',tone:'green'};
        }

        function latestRequestForUser(userId){
            const arr=(state.userRequests||[]).filter(r=>String(r.user_id)===String(userId));
            return arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0] || null;
        }

        function requestLabel(req){
            if(!req) return '';
            if(req.request_type==='new_account') return 'طلب إنشاء حساب';
            if(req.request_type==='temporary_completion') return 'إكمال حساب مؤقت';
            if(req.request_type==='revoked_reapply') return 'طلب موافقة جديد';
            return 'طلب حساب';
        }

        async function openUsersManagement(){
            if(!isAdmin()) { showToast('غير مصرح به','error'); return; }
            state.view='users';
            state.usersLoading=true;
            render();
            try{
                const [profilesRes, requestsRes, messagesRes] = await Promise.all([
                    sb.from('profiles').select('*').order('created_at',{ascending:false}),
                    sb.from('account_requests').select('*').order('created_at',{ascending:false}),
                    sb.from('user_messages').select('*').order('created_at',{ascending:false}).limit(20)
                ]);
                if(profilesRes.error) throw profilesRes.error;
                if(requestsRes.error) throw requestsRes.error;
                if(messagesRes.error) throw messagesRes.error;
                state.users=profilesRes.data||[];
                state.userRequests=requestsRes.data||[];
                state.adminMessages=messagesRes.data||[];
                await loadWelcomeVideoLibrary();
                await Promise.all([loadWelcomeVideoRecipientsStatus(), loadWelcomeVideoExcluded()]);
                try{
                    const currentUserId = state.user?.id;
                    if(!currentUserId) throw new Error('انتهت جلسة الدخول.');
                    const {data:hidden}=await sb.from('admin_message_hidden').select('message_id').eq('user_id',currentUserId);
                    const hiddenIds=new Set((hidden||[]).map(x=>String(x.message_id)));
                    state.adminMessages=state.adminMessages.filter(m=>!hiddenIds.has(String(m.id)));
                }catch(_){}
            }catch(err){
                console.error(err);
                showToast(`تعذر تحميل المستخدمين: ${err.message||'خطأ غير معروف'}`,'error');
            }finally{
                state.usersLoading=false;
                render();
            }
        }

        function filteredUsers(){
            const q=(state.usersSearch||'').trim().toLowerCase();
            return (state.users||[]).filter(u=>{
                const st=userStatus(u).key;
                const matchFilter=state.usersFilter==='all'||st===state.usersFilter;
                const hay=[
                    u.full_name,u.name,u.email,u.phone,u.phone_number,u.role,u.status,u.account_type
                ].filter(Boolean).join(' ').toLowerCase();
                return matchFilter && (!q||hay.includes(q));
            });
        }

        function renderUsersManagement(){
            const users=filteredUsers();
            const all=state.users||[];
            const wvStatusRow=(u,label)=>{
                const nm=userDisplayName(u); const initial=(nm.trim()[0]||'؟').toUpperCase();
                return `<div class="wv-status-row"><span class="user-picker-avatar">${escapeHtml(initial)}</span><span>${escapeHtml(nm)}</span><small>${escapeHtml(label)}</small>${label==='في الانتظار'?`<button type="button" class="wv-status-remove" data-act="exclude-welcome-video-user" data-user-id="${escapeHtml(u.id)}" title="استبعاد هذا العضو" aria-label="استبعاد ${escapeHtml(nm)}">×</button>`:''}</div>`;
            };
            const wvStatusRows=(state.welcomeVideoRecipientsStatus||[]);
            const wvExcludedIds=new Set(state.welcomeVideoExcluded||[]);
            const wvPendingUsers=wvStatusRows.filter(r=>!r.viewed_at && !wvExcludedIds.has(String(r.user_id))).map(r=>all.find(u=>String(u.id)===String(r.user_id))).filter(Boolean);
            const wvViewedUsers=wvStatusRows.filter(r=>!!r.viewed_at).map(r=>({u:all.find(u=>String(u.id)===String(r.user_id)),at:r.viewed_at})).filter(x=>x.u);
            const wvExcludedUsers=all.filter(u=>wvExcludedIds.has(String(u.id)));
            const counts={
                all:all.length,
                approved:all.filter(u=>userStatus(u).key==='approved').length,
                pending:all.filter(u=>userStatus(u).key==='pending').length,
                temporary:all.filter(u=>userStatus(u).key==='temporary').length,
                revoked:all.filter(u=>userStatus(u).key==='revoked').length
            };
            const cards=users.map(u=>{
                const st=userStatus(u);
                const req=latestRequestForUser(u.id);
                const initials=(userDisplayName(u).replace('الاسم غير مسجل','؟').trim().charAt(0)||'؟').toUpperCase();
                const avatar=publicStorageUrl('avatars',u.avatar_path||u.avatar_url);
                const avatarHtml=avatar?`<img src="${escapeHtml(avatar)}" alt="">`:escapeHtml(initials);
                const date=u.created_at?new Date(u.created_at).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}):'—';
                return `
                  <article class="um-user-card">
                    <div class="um-user-main">
                      <div class="um-avatar">${avatarHtml}</div>
                      <div class="um-user-ident">
                        <div class="um-name-line"><div class="um-name">${escapeHtml(userDisplayName(u))}</div>${renderTitleChips(u.profile_title)}</div>
                        <div class="um-email">${escapeHtml(u.email||'البريد غير مسجل')}</div>
                        <div class="um-meta"><span>${escapeHtml(userDisplayPhone(u))}</span><span>•</span><span>${escapeHtml(date)}</span></div>
                      </div>
                      <span class="um-status ${st.tone}">${escapeHtml(st.label)}</span>
                    </div>
                    ${req ? `<div class="um-request-line"><i class="fas fa-file-signature"></i><span>${escapeHtml(requestLabel(req))}</span>${req.note?`<span class="um-note">— ${escapeHtml(req.note)}</span>`:''}</div>`:''}
                    <div class="um-card-actions">
                      <button data-act="user-details" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-eye"></i> التفاصيل</button>
                      ${st.key==='pending' ? `<button class="success" data-act="user-approve" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-check"></i> قبول</button>`:''}
                      ${st.key!=='admin' && st.key!=='revoked' ? `<button data-act="user-revoke" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-ban"></i> رفض / إيقاف</button>`:''}
                      ${st.key==='revoked' ? `<button class="success" data-act="user-approve" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-rotate-left"></i> إعادة تفعيل</button>`:''}
                      ${st.key==='approved' ? `<button data-act="user-reapply" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-user-clock"></i> طلب إذن من جديد</button><button data-act="user-force-password" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-key"></i> تغيير كلمة السر عند الدخول</button>`:''}
                      ${st.key!=='admin' ? `<button class="welcome-user-action" data-act="user-welcome" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-hand-sparkles"></i> ترحيب أول مرة</button>`:''}${st.key!=='admin' ? `<button data-act="user-edit" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-user-pen"></i> تعديل</button>`:''}
                      ${st.key!=='admin' ? `<button class="danger" data-act="user-delete" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-trash"></i> حذف</button>`:''}
                    </div>
                  </article>`;
            }).join('');

            return `
            <section class="um-page">
              <div class="um-head">
                <div>
                  <button class="um-back" data-act="go-home"><i class="fas fa-arrow-right"></i> الرئيسية</button>
                  <h1><i class="fas fa-users-gear"></i> إدارة المستخدمين</h1>
                  <p>إدارة الحسابات والطلبات والموافقة والرفض والحسابات المؤقتة من داخل المنصة.</p>
                </div>
                <button class="um-create" data-act="user-create-temp"><i class="fas fa-user-plus"></i> إنشاء حساب مؤقت</button>

              </div>

              <div class="um-toolbar">
                <div class="um-search"><i class="fas fa-search"></i><input id="userSearch" type="search" value="${escapeHtml(state.usersSearch)}" placeholder="ابحث بالاسم أو البريد أو التليفون..."></div>
                <button class="um-refresh" data-act="refresh-users"><i class="fas fa-rotate"></i> تحديث</button>
              </div>

              ${state.usersLoading
                  ? `<div class="um-empty"><i class="fas fa-spinner fa-spin"></i><h3>جاري تحميل الحسابات…</h3></div>`
                  : users.length
                    ? `<div class="um-list">${cards}</div>`
                    : `<div class="um-empty"><i class="fas fa-user-slash"></i><h3>لا توجد حسابات مطابقة</h3><p>غيّر البحث أو الفلتر وجرب مرة أخرى.</p></div>`
              }

              <div class="message-compose-card">
                <div class="message-compose-head">
                  <div><h3><i class="fas fa-bullhorn"></i> رسائل الحسابات</h3><p>اكتب رسالة تظهر عند فتح المنصة، واختر حسابًا واحدًا أو جميع الحسابات.</p></div>
                  <div class="message-compose-head-actions">
                    <button class="message-compose-btn" data-act="compose-user-message"><i class="fas fa-pen"></i> كتابة رسالة</button>

                  </div>
                </div>
                ${state.adminMessages?.length ? `<div class="message-list">${state.adminMessages.slice(0,8).map(msg=>{
                    const target=msg.target_user_id ? state.users.find(x=>String(x.id)===String(msg.target_user_id)) : null;
                    const views = msg.max_views == null ? 'بدون حد' : `${msg.max_views} مرة`;
                    return `<div class="message-list-item"><div class="message-list-item-main"><strong>${escapeHtml(msg.title||'رسالة من الإدارة')}</strong><small>${escapeHtml((msg.body||'').slice(0,180))}</small><small>تظهر: ${escapeHtml(views)}</small></div><div class="message-list-actions"><span class="message-audience">${target?escapeHtml(userDisplayName(target)):'كل الحسابات'}</span><button class="message-action-btn" data-act="hide-admin-message" data-message-id="${escapeHtml(msg.id)}">إخفاء عندي</button><button class="message-action-btn danger" data-act="delete-admin-message" data-message-id="${escapeHtml(msg.id)}">${target?'حذف الرسالة':'حذف عن الكل'}</button></div></div>`;
                }).join('')}</div>` : `<div class="um-footer-note"><i class="fas fa-inbox"></i> لا توجد رسائل مرسلة حتى الآن.</div>`}
              </div>


              <div class="welcome-video-admin-card">
                <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
                  <div>
                    <h3><i class="fas fa-film" style="color:var(--primary)"></i> فيديو الترحيب الأول</h3>
                    <p>يتعرض للمستخدم مرة واحدة فقط حسب الإعداد. لا يوجد فيديو تلقائي داخل الموقع؛ ارفع فيديو من هنا وحدد مين يشوفه، أو رجّع ظهوره من جديد.</p>
                  </div>
                  <div class="welcome-video-status">
                    <span>${state.welcomeVideoCampaign?.is_active===false?'متوقف':'مفعّل'}</span>
                    <span>${state.welcomeVideoCampaign?.audience_mode==='selected'?'أشخاص محددون':'كل الحسابات'}</span>
                    <span>${state.welcomeVideoCampaign?.video_path?'فيديو مخصص من الأدمن':'لا يوجد فيديو محدد'}</span>
                  </div>
                </div>

                  <div class="field">
                    <label>إظهار الفيديو لـ</label>
                    <select id="welcome-video-audience">
                      <option value="all" ${state.welcomeVideoCampaign?.audience_mode!=='selected'?'selected':''}>كل الحسابات</option>
                      <option value="selected" ${state.welcomeVideoCampaign?.audience_mode==='selected'?'selected':''}>أشخاص أختارهم</option>
                    </select>

                  <div class="field">
                    <label>حالة الفيديو</label>

                </div>
                <div class="welcome-video-recipients ${state.welcomeVideoCampaign?.audience_mode==='selected'?'show':''}" id="welcome-video-recipients-box">
                  <div class="field"><label>اختار الحسابات</label>
                    <select id="welcome-video-recipient-select" multiple size="7" class="access-multi">
                      ${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${(state.welcomeVideoCampaign?.recipient_ids||[]).includes(u.id)?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}
                    </select>
                    <small class="access-help">دور بالاسم أو الإيميل، أو استخدم "تحديد الكل".</small>
                  </div>

                ${state.welcomeVideoCampaign?.audience_mode==='selected' ? `<div class="welcome-video-status-lists">

                  </div>
                </div>` : ''}
                <div class="welcome-video-excluded-box">
                  <h3><i class="fas fa-user-slash" style="color:var(--danger,#c6493f)"></i> مستبعدون من رؤية الفيديو</h3>

                  <div class="field">
                    <select id="welcome-video-excluded-select" multiple size="6" class="access-multi">
                      ${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${wvExcludedIds.has(String(u.id))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}
                    </select>
                  </div>
                  <div class="welcome-video-admin-controls">
                    <button class="btn-cancel" data-act="save-welcome-video-excluded"><i class="fas fa-user-slash"></i> حفظ قائمة المستبعدين</button>

                  ${wvExcludedUsers.length ? `<div class="welcome-video-excluded-current">${wvExcludedUsers.map(u=>`<span class="wv-excluded-chip"><i class="fas fa-ban"></i> ${escapeHtml(userDisplayName(u))}</span>`).join('')}</div>` : ''}

                <div class="welcome-video-library-modern">

                    <div>
                      <h4><i class="fas fa-film"></i> مكتبة فيديوهات الترحيب</h4>
                      <p>كل فيديو يظهر باسمه الأصلي. استخدم «اختيار» لتحديد الفيديو الذي سيعمل للأعضاء، و«معاينة» لمشاهدته.</p>

                  </div>

                            <button type="button" data-act="preview-welcome-video" data-video-path="${escapeHtml(v.path)}" data-video-name="${escapeHtml(displayName)}"><i class="fas fa-play"></i> معاينة</button>
                            <button type="button" class="wv-card-delete" data-act="delete-welcome-video" data-video-path="${escapeHtml(v.path)}" data-video-name="${escapeHtml(displayName)}"><i class="fas fa-xmark"></i> حذف</button>

                    }).join('') : `<div class="welcome-video-library-empty">

                </div>
                <div class="welcome-video-library-grid" style="display:none!important">
                  <div class="field">
                    <select id="welcome-video-library-select">
                      <option value="">لا تغيير</option>
                      ${(state.welcomeVideoLibrary||[]).map(v=>`<option value="${escapeHtml(v.path)}" ${((state.welcomeVideoDraftPath||state.welcomeVideoCampaign?.video_path||'')===v.path)?'selected':''}>${escapeHtml(welcomeVideoDisplayName(v.name||v.path))}</option>`).join('')}
                    </select>
                    <div class="welcome-video-library-preview">
                      ${state.welcomeVideoCampaign?.video_path ? `<video id="welcome-video-admin-preview" controls playsinline preload="metadata" src="${escapeHtml(publicStorageUrl('welcome-videos',state.welcomeVideoCampaign.video_path))}"></video>` : ''}

<div class="field" style="margin-top:12px">

            if (m.kind === 'profile') {

                return `

                    <button type="button" class="color-swatch color-lime ${m.textColor==='#84cc16'?'active':''}" data-text-color="#84cc16" title="ليموني"></button>
                    <button type="button" class="color-swatch color-brown ${m.textColor==='#92400e'?'active':''}" data-text-color="#92400e" title="بني"></button>
                    <button type="button" class="color-swatch color-rose ${m.textColor==='#e11d48'?'active':''}" data-text-color="#e11d48" title="وردي داكن"></button>
                  </div>

                <div class="content-access-panel">
                  <div class="availability-title"><i class="fas fa-eye"></i><span>إتاحة هذا المحتوى</span></div>
                  <div class="field"><label>يظهر لـ</label><select id="content-visibility">
                    <option value="all" ${m.visibilityMode==='all'?'selected':''}>🌍 الكل</option>
                    <option value="selected" ${m.visibilityMode==='selected'?'selected':''}>👥 أشخاص أختارهم</option>
                    <option value="admins" ${m.visibilityMode==='admins'?'selected':''}>🛡️ المشرفين والأدمن</option>
                    <option value="owner" ${m.visibilityMode==='owner'?'selected':''}>🔒 أنا فقط</option>
                  </select></div>
                  <div class="field access-users-field" style="display:${m.visibilityMode==='selected'?'block':'none'}"><label>اختار الناس اللي يظهر لهم</label><select id="content-allow-users" class="access-multi" multiple>${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${((m.allowedUsers||[]).includes(String(u.id)))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}</select><small class="access-help">على الكمبيوتر استخدم Ctrl، وعلى الموبايل اضغط على الأشخاص اللي عايز تحددهم.</small></div>
                  <div class="field"><label>استثناء — ناس ما يظهرش لهم</label><select id="content-deny-users" class="access-multi" multiple>${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${((m.excludedUsers||[]).includes(String(u.id)))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}</select><small class="access-help">الاستثناء أقوى من الإتاحة، ويمكن استخدامه مع أي اختيار.</small></div>

            </div>`;
        }

        // ─── Confirm ───

        function renderConfirm() {
            return `
            <div class="overlay" data-act="close-confirm-overlay">
              <div class="modal confirm-box" data-stop="1">
                <p>${state.confirm.message}</p>
                <div class="modal-actions">
                  <button class="${state.confirm.confirmClass || 'btn-danger'}" data-act="confirm-yes">${escapeHtml(state.confirm.confirmLabel || 'تأكيد')}</button>
                  <button class="btn-cancel" data-act="close-confirm">إلغاء</button>
                </div>
              </div>
            </div>`;
        }

        // ════════════════════════════════════════════════════════════════════
        //  EVENTS
        // ════════════════════════════════════════════════════════════════════

        function attachEvents() {
            enhanceAccessMultiSelects();
            enhanceNiceFileInputs();
            document.querySelectorAll('[data-act]').forEach(el => {
                el.removeEventListener('click', onAction);
                el.addEventListener('click', onAction);
            });

            // File inputs - manager avatar
            const managerAvatarInput=document.getElementById('manager-avatar');
            if(managerAvatarInput){ managerAvatarInput.removeEventListener('change',onManagerAvatarChange); managerAvatarInput.addEventListener('change',onManagerAvatarChange); }
            const managerPageAvatarInput=document.getElementById('manager-page-avatar-input');
            if(managerPageAvatarInput){
                managerPageAvatarInput.removeEventListener('change',onManagerPageAvatarChange);
                managerPageAvatarInput.addEventListener('change',onManagerPageAvatarChange);
            }

            // File inputs - avatar
            const avatarInput = document.getElementById('modal-avatar');
            if (avatarInput) {
                avatarInput.removeEventListener('change', onAvatarChange);
                avatarInput.addEventListener('change', onAvatarChange);
            }

            // File inputs - image
            const imgInput = document.getElementById('modal-image');
            if (imgInput) {
                imgInput.removeEventListener('change', onImageChange);
                imgInput.addEventListener('change', onImageChange);
            }

            // File inputs - file
            const fileInput = document.getElementById('modal-file');
            if (fileInput) {
                fileInput.removeEventListener('change', onFileChange);
                fileInput.addEventListener('change', onFileChange);
            }

            const userSearch = document.getElementById('userSearch');
            if(userSearch){
                userSearch.addEventListener('input', e=>{
                    state.usersSearch=e.target.value;
                    const caret=e.target.selectionStart;
                    render();
                    const next=document.getElementById('userSearch');
                    if(next){ next.focus(); try{next.setSelectionRange(caret,caret);}catch(_){ } }
                });
            }


            const wvAudience=document.getElementById('welcome-video-audience');
            if(wvAudience){
              wvAudience.addEventListener('change',()=>{
                const box=document.getElementById('welcome-video-recipients-box');
                if(box) box.classList.toggle('show', wvAudience.value==='selected');
              });
            }
            const wvLibrary=document.getElementById('welcome-video-library-select');
            if(wvLibrary){
              wvLibrary.addEventListener('change',()=>{
                const v=document.getElementById('welcome-video-admin-preview');
                const path=wvLibrary.value||state.welcomeVideoCampaign?.video_path||'';
                if(!v) return;
                if(path){v.src=publicStorageUrl('welcome-videos',path);v.style.display='block';} else {v.removeAttribute('src');v.style.display='none';}
              });
            }

            const vis = document.getElementById('content-visibility');
            if(vis){ vis.addEventListener('change',()=>{ const box=document.querySelector('.access-users-field'); if(box) box.style.display=vis.value==='selected'?'block':'none'; if(state.modal) state.modal.visibilityMode=vis.value; }); }
            const boldToggle=document.getElementById('text-bold-toggle');
            if(boldToggle){boldToggle.addEventListener('click',()=>{ if(state.modal){ state.modal.textBold=state.modal.textBold===false; } render(); });}
            document.querySelectorAll('[data-text-color]').forEach(btn=>btn.addEventListener('click',()=>{ if(state.modal){state.modal.textColor=btn.getAttribute('data-text-color')||'#111827'; render();} }));

            // Name input
            const nameInput = document.getElementById('modal-name');
            if (nameInput) {
                nameInput.removeEventListener('input', onNameInput);
                nameInput.addEventListener('input', onNameInput);
            }

        }

        function onManagerAvatarChange(e){
            e.stopPropagation(); const f=e.target.files?.[0]; if(!f||!state.modal) return;
            if(!f.type.startsWith('image/')) return showToast('اختر صورة صحيحة.','error');
            state.modal.managerAvatarFile=f; state.modal.managerAvatar=URL.createObjectURL(f); render();
        }

        function onManagerPageAvatarChange(e){
            const f=e.target.files?.[0];
            if(!f || !f.type.startsWith('image/')) return showToast('اختر صورة صحيحة.','error');
            state.managerPageAvatarFile=f;
            const preview=document.getElementById('manager-page-avatar-preview');
            if(preview){
                const url=URL.createObjectURL(f);
                preview.innerHTML=`<img src="${url}" alt="معاينة الصورة">`;
            }
        }


        function onAvatarChange(e) {
            e.stopPropagation(); const f=e.target.files?.[0]; if(!f||!state.modal) return;
            if(!f.type.startsWith('image/')) return showToast('اختر صورة صحيحة.','error');
            state.modal.avatarFile=f; state.modal.avatar=URL.createObjectURL(f); render();
        }

        function onImageChange(e) {
            e.stopPropagation(); const f=e.target.files?.[0]; if(!f||!state.modal) return;
            if(!f.type.startsWith('image/')) return showToast('اختر صورة صحيحة.','error');
            state.modal.imageFile=f; state.modal.image=URL.createObjectURL(f); render();
        }

        function onFileChange(e) {
            e.stopPropagation(); const f=e.target.files?.[0]; if(!f||!state.modal) return;
            state.modal.fileFile=f; state.modal.fileName=f.name; render();
        }

        function onNameInput(e) {
            if (state.modal) {
                state.modal.name = e.target.value;
            }
        }

        async function onAction(e) {
            const el = e.currentTarget;
            const act = el.dataset.act;

            // ─── Admin controls must never trigger the parent Card click ───
            if (el.closest('.card-admin-actions')) {
                e.stopPropagation();
            }

            // ─── Modal overlay: only close if click is directly on overlay ───
            if (act === 'close-modal-overlay') {
                // Only close if the click target is the overlay itself (not a child)
                if (e.target === el) {
                    closeModal();
                }
                return;
            }

            if (act === 'close-confirm-overlay') {
                if (e.target === el) {
                    closeConfirm();
                }
                return;
            }

            // ─── Any click inside a modal is never an overlay click ───
            if (el.closest('.modal') && act !== 'close-modal' && act !== 'close-confirm') {
                // Keep processing the button's own action, but never let it close the overlay.
                e.stopPropagation();
            }

            // ─── Standard actions ───
            if (act === 'close-modal') {
                const wasFirst = state.modal?.kind === 'first-welcome';
                const pending = Array.isArray(state.pendingUserMessages) ? [...state.pendingUserMessages] : [];
                closeModal();
                if (wasFirst) {
                    if (!state.user.phone) { openModal('phone-required',{}); }
                    else if (pending.length) {
                        openModal('user-message',{messages:pending});
                        const ids=pending.map(x=>x.id).filter(Boolean);
                        state.pendingUserMessages=[];
                    }
                    else { /* video is shown before the first welcome, not after it */ }
                }
                return;
            }
            if (act === 'close-confirm') {
                closeConfirm();
                return;
            }

            // ─── Stop propagation for any modal inner clicks ───
            if (el.dataset.stop) return;

            switch (act) {
                case 'login': {
                    // لا يوجد اختيار للدور هنا؛ الدور يأتي من Supabase.
                    return;
                }
                case 'open-admin-panel': {
                    if (!isAdmin()) {
                        showToast('غير مصرح به', 'error');
                        break;
                    }
                    await openUsersManagement();
                    break;
                }
                case 'user-filter': {
                    state.usersFilter = el.dataset.filter || 'all';
                    render();
                    break;
                }
                case 'refresh-users': {
                    await openUsersManagement();
                    break;
                }
                case 'user-details': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-details',{user:u});
                    break;
                }
                case 'user-edit': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-edit',{user:u});
                    break;
                }
                case 'user-welcome': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-welcome',{user:u,mode:'ready'});
                    break;
                }
                case 'welcome-mode': {
                    const u=state.modal?.user||state.users.find(x=>String(x.id)===String(state.modal?.userId));
                    openModal('user-welcome',{user:u,mode:el.dataset.mode==='custom'?'custom':'ready'});
                    break;
                }
                case 'compose-user-message': {
                    openModal('compose-user-message',{targetUserId:'all'});
                    break;
                }
                case 'message-target': {
                    const target=el.dataset.target==='one' ? (state.users.find(u=>u.role!=='admin')?.id || 'all') : 'all';
                    openModal('compose-user-message',{targetUserId:target});
                    break;
                }
                case 'send-user-welcome': {
                    const m=state.modal||{}; const u=m.user||{};
                    const custom=m.mode==='custom';
                    const title=(document.getElementById('welcome-message-title')?.value||'').trim();
                    const body=(document.getElementById('welcome-message-body')?.value||'').trim();
                    const mediaFile=document.getElementById('welcome-message-media')?.files?.[0]||null;
                    const readyTitle=`أهلا بيك يا ${userDisplayName(u)} 👋`;
                    const readyBody='نورتنا ✨ نتمنى تلاقي كل اللي محتاجه هنا وتكون تجربتك داخل المنصة أسهل وأفضل.';
                    const finalTitle=custom?title:readyTitle;
                    let finalBody=custom?body:readyBody;
                    if(!finalTitle || (!finalBody && !mediaFile)) return showToast('أكمل عنوان الرسالة ونصها أو اختر مرفقًا.','error');
                    if(mediaFile && mediaFile.size>25*1024*1024) return showToast('حجم المرفق يجب ألا يتجاوز 25 ميجابايت.','error');
                    const btn=el; btn.disabled=true; btn.textContent='جاري الإرسال…';
                    try{
                        let marker='';
                        if(mediaFile){
                            if(!(mediaFile.type.startsWith('image/')||mediaFile.type.startsWith('video/'))) throw new Error('الصورة أو الفيديو غير مدعوم.');

        function enhanceAccessMultiSelects(){
            document.querySelectorAll('select.access-multi[multiple]').forEach(sel=>{
                if(sel.dataset.enhanced==='1') return;
                sel.dataset.enhanced='1';
                sel.style.display='none';
                const options=[...sel.options];
                const wrap=document.createElement('div');
                wrap.className='user-picker';
                const countLabel=()=>{const n=options.filter(o=>o.selected).length; return n?`${n} محدد`:'لا يوجد اختيار';};
                wrap.innerHTML=`
                  <div class="user-picker-search"><i class="fas fa-magnifying-glass"></i><input type="text" class="user-picker-search-input" placeholder="ابحث بالاسم أو البريد..."></div>
                  <div class="user-picker-toolbar">
                    <button type="button" class="user-picker-mini-btn" data-picker-act="all">تحديد الكل</button>
                    <button type="button" class="user-picker-mini-btn" data-picker-act="none">إلغاء الكل</button>
                    <span class="user-picker-count">${countLabel()}</span>
                  </div>
                  <div class="user-picker-list">
                    ${options.length? options.map((o,i)=>{
                        const label=o.textContent||'';
                        const parts=label.split(' — ');
                        const name=parts[0]||label; const email=parts[1]||'';
                        const initial=(name.trim()[0]||'؟').toUpperCase();
                        return `<label class="user-picker-row ${o.selected?'checked':''}" data-idx="${i}"><input type="checkbox" ${o.selected?'checked':''}><span class="user-picker-avatar">${initial}</span><span class="user-picker-info"><span class="user-picker-name">${name}</span>${email?`<span class="user-picker-email">${email}</span>`:''}</span></label>`;
                    }).join('') : '<div class="user-picker-empty">لا يوجد حسابات متاحة</div>'}
                  </div>`;
                sel.insertAdjacentElement('afterend', wrap);
                const countEl=wrap.querySelector('.user-picker-count');
                const rows=[...wrap.querySelectorAll('.user-picker-row')];
                const sync=()=>{ countEl.textContent=countLabel(); };
                rows.forEach(row=>{
                    const idx=+row.dataset.idx;
                    const cb=row.querySelector('input[type=checkbox]');
                    cb.addEventListener('change',()=>{
                        options[idx].selected=cb.checked;
                        row.classList.toggle('checked',cb.checked);
                        sel.dispatchEvent(new Event('change',{bubbles:true}));
                        sync();
                    });
                });
                wrap.querySelector('.user-picker-search-input').addEventListener('input',e=>{
                    const q=e.target.value.trim().toLowerCase();
                    rows.forEach(row=>{
                        const txt=row.textContent.toLowerCase();
                        row.style.display=(!q||txt.includes(q))?'flex':'none';
                    });
                });
                wrap.querySelectorAll('[data-picker-act]').forEach(btn=>{
                    btn.addEventListener('click',()=>{
                        const on=btn.dataset.pickerAct==='all';
                        rows.forEach(row=>{
                            if(row.style.display==='none') return;
                            const idx=+row.dataset.idx; const cb=row.querySelector('input[type=checkbox]');
                            cb.checked=on; options[idx].selected=on; row.classList.toggle('checked',on);
                        });
                        sel.dispatchEvent(new Event('change',{bubbles:true}));
                        sync();
                    });
                });
            });
        }

        function wireNiceFileInput(inputId, opts={}){
            const input=document.getElementById(inputId);
            if(!input || input.dataset.niceWired==='1') return;
            input.dataset.niceWired='1';
            const preview=document.getElementById(inputId+'-preview');
            const label=document.querySelector(`label.nice-file-label[for="${inputId}"]`);
            input.addEventListener('change',()=>{
                const file=input.files?.[0];
                if(inputId === 'welcome-video-file'){
                    if(label){ const span=label.querySelector('span'); if(span) span.textContent=file ? 'فيديو جاهز للحفظ' : (opts.defaultLabel||'اضغط لاختيار فيديو أو اسحبه هنا'); }
                    if(preview){
                        if(!file){ preview.className='nice-file-preview'; preview.innerHTML=''; }
                        else{
                            const url=URL.createObjectURL(file);
                            const sizeMb=(file.size/1024/1024).toFixed(1);
                            preview.innerHTML=`<video src="${url}" controls playsinline preload="metadata"></video><div class="welcome-video-upload-ready"><i class="fas fa-circle-check"></i><span title="${escapeHtml(file.name)}">${escapeHtml(file.name)} · ${sizeMb} MB — جاهز للحفظ</span><button type="button" class="nice-file-remove" data-clear-for="${inputId}">إزالة</button></div>`;
                            preview.className='nice-file-preview show';
                        }
                    }
                    return;
                }
                if(!preview) return;
                if(!file){ preview.className='nice-file-preview'; preview.innerHTML=''; return; }
                const url=URL.createObjectURL(file);
                const sizeMb=(file.size/1024/1024).toFixed(1);
                let mediaHtml='';
                if(file.type.startsWith('video/')) mediaHtml=`<video src="${url}" controls playsinline preload="metadata"></video>`;
                else if(file.type.startsWith('image/')) mediaHtml=`<img src="${url}" alt="">`;
                preview.innerHTML=`${mediaHtml}<div class="nice-file-preview-meta"><i class="fas fa-paperclip"></i><span>${file.name}</span><span>· ${sizeMb} MB</span><button type="button" class="nice-file-remove" data-clear-for="${inputId}">إزالة</button></div>`;
                preview.className='nice-file-preview show';
                if(label){ const span=label.querySelector('span'); if(span) span.textContent=file.name; }
            });
            if(preview){
                preview.addEventListener('click',e=>{
                    const btn=e.target.closest('[data-clear-for]');
                    if(!btn) return;
                    input.value='';
                    preview.className='nice-file-preview'; preview.innerHTML='';
                    if(label){ const span=label.querySelector('span'); if(span) span.textContent=opts.defaultLabel||'اضغط لاختيار ملف أو اسحبه هنا'; }
                });
            }
        }

        async function getWelcomeVideoSignedUrl(path){
            if(!path) return '';
            try{
                const {data,error}=await sb.storage.from('welcome-videos').createSignedUrl(path,3600);
                if(error) throw error;
                return data?.signedUrl||'';
            }catch(_){ return ''; }
        }

        async function deleteWelcomeVideoObject(path){
            if(!path) throw new Error('مسار الفيديو غير موجود.');
            const campaign=state.welcomeVideoCampaign||{};
            const selectedPath=state.welcomeVideoDraftPath||campaign.video_path||'';
            const affectsCurrent=selectedPath===path || campaign.video_path===path;
            if(affectsCurrent){
                const audience=campaign.audience_mode==='selected'?'selected':'all';
                const ids=Array.isArray(campaign.recipient_ids)?campaign.recipient_ids:[];
                const {error:assignmentError}=await sb.rpc('midad_admin_save_welcome_video',{
                    p_video_path:'',
                    p_audience_mode:audience,
                    p_user_ids:ids,
                    p_is_active:campaign.is_active!==false
                });
                if(assignmentError) throw assignmentError;
            }
            const {error}=await sb.storage.from('welcome-videos').remove([path]);
            if(error) throw error;
            state.welcomeVideoDraftPath = affectsCurrent ? '' : selectedPath;
            await Promise.all([loadWelcomeVideoLibrary(),loadWelcomeVideoCampaign(),loadWelcomeVideoRecipientsStatus()]);
        }

async function listWelcomeVideoObjects(path=''){
            const out=[];
            try{
                const {data,error}=await sb.storage.from('welcome-videos').list(path,{limit:100,offset:0,sortBy:{column:'name',order:'asc'}});
                if(error) throw error;
                for(const item of (data||[])){
                    if(!item?.name) continue;
                    const childPath=path ? `${path}/${item.name}` : item.name;
                    const isFolder=!item.id && !item.metadata;
                    if(isFolder){
                        const nested=await listWelcomeVideoObjects(childPath);
                        out.push(...nested);
                    }else{
                        const ext=(item.name.split('.').pop()||'').toLowerCase();
                        if(['mp4','webm','mov','m4v'].includes(ext)) out.push({path:childPath,name:item.name,size:item.metadata?.size||0,updated:item.updated_at||item.created_at||''});
                    }
                }
            }catch(err){
                // Never turn an RLS/Storage error into an empty library.
                // That was the reason an uploaded video appeared briefly and
                // disappeared after the next render.
                console.warn('welcome video library',err);
                throw err;
            }
            return out;
        }
        async function loadWelcomeVideoLibrary(){
            const previous=Array.isArray(state.welcomeVideoLibrary) ? state.welcomeVideoLibrary : [];
            try{
                state.welcomeVideoLibrary=await listWelcomeVideoObjects('');
            }catch(err){
                // Keep the last known library instead of erasing it.
                state.welcomeVideoLibrary=previous;
                console.warn('welcome video library refresh kept previous list',err);
            }
            return state.welcomeVideoLibrary;
        }

        async function loadWelcomeVideoCampaign(){
            try{
                const {data,error}=await sb.from('welcome_video_campaign').select('*').eq('id',1).maybeSingle();
                if(error) throw error;
                let recipient_ids=[];
                if(data?.audience_mode==='selected'){const r=await sb.from('welcome_video_recipients').select('user_id').eq('campaign_id',1);if(!r.error) recipient_ids=(r.data||[]).map(x=>x.user_id);}
                state.welcomeVideoCampaign=data?{...data,recipient_ids}:null;
                if(!state.welcomeVideoDraftPath) state.welcomeVideoDraftPath=data?.video_path||'';
                return state.welcomeVideoCampaign;
            }catch(_){state.welcomeVideoCampaign=null;return null;}
        }
        async function loadWelcomeVideoRecipientsStatus(){
            try{
                const {data,error}=await sb.from('welcome_video_recipients').select('user_id,viewed_at').eq('campaign_id',1);
                if(error) throw error;
                state.welcomeVideoRecipientsStatus=data||[];
            }catch(_){
                // viewed_at may not exist yet if the SQL migration hasn't run —
                // fall back to just the recipient list so "لسه ما شافوش" still
                // shows correctly instead of appearing empty.
                try{
                    const {data,error}=await sb.from('welcome_video_recipients').select('user_id').eq('campaign_id',1);
                    if(error) throw error;
                    state.welcomeVideoRecipientsStatus=(data||[]).map(x=>({user_id:x.user_id,viewed_at:null}));
                }catch(_){ state.welcomeVideoRecipientsStatus=[]; }

            return state.welcomeVideoRecipientsStatus;

        async function markWelcomeVideoViewed(){
            try{await sb.rpc('mark_welcome_video_viewed');}catch(_){}
            // Best-effort direct write kept as a fallback, but the reliable path
            // is the SECURITY DEFINER RPC below — a member's own RLS may not
            // allow writing to welcome_video_recipients directly, which is why
            // "شافوا بالفعل" could stay empty even after someone watched it.
            try{await sb.rpc('mark_welcome_video_viewed_status');}catch(_){}
            try{
                const uid=state.user?.id||currentAuthUser?.id;
                if(uid) await sb.from('welcome_video_recipients').update({viewed_at:new Date().toISOString()}).eq('campaign_id',1).eq('user_id',uid);
            }catch(_){}
        }
        async function showWelcomeVideoOnce(onDone=null){
            if(!state.user || isAdmin()){ if(onDone) onDone(); return; }
            const url=await getWelcomeVideoToShow(); if(!url){ if(onDone) onDone(); return; }
            const overlay=document.createElement('div'); overlay.className='welcome-video-overlay show';
            overlay.innerHTML=`<div class="welcome-video-shell"><video class="welcome-video" playsinline preload="auto" autoplay></video><div class="welcome-video-sound-gate" style="display:none"><button type="button" class="welcome-video-sound-btn">🔊 تشغيل الفيديو بالصوت</button></div></div>`;
            document.body.appendChild(overlay); const video=overlay.querySelector('video'), gate=overlay.querySelector('.welcome-video-sound-gate');
            video.src=url; video.muted=false; video.volume=1; let done=false;
            const finish=async()=>{if(done)return;done=true;await markWelcomeVideoViewed();overlay.remove();if(typeof onDone==='function') onDone();};
            const fail=()=>{if(done)return;done=true;overlay.remove();if(typeof onDone==='function') onDone();};
            video.addEventListener('ended',finish,{once:true}); video.addEventListener('error',fail,{once:true});
            const start=async()=>{try{video.muted=false;await video.play();gate.style.display='none';}catch(_){gate.style.display='flex';}};
            video.addEventListener('canplay',start,{once:true}); gate.querySelector('button').addEventListener('click',async()=>{try{video.muted=false;await video.play();gate.style.display='none';}catch(_){}}); setTimeout(start,300);
        }

        async function bootApp(){
            try{
                const {data:{session}}=await sb.auth.getSession();
                if(!session?.user){renderAccessMessage('لا توجد جلسة دخول','افتح الموقع من البداية وسجل الدخول أولًا.');return;}
                currentAuthUser = session.user;
                const {data:profile,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
                if(error)throw error;
                if(!profile){renderAccessMessage('الحساب غير مكتمل','توجد جلسة Auth لكن لا يوجد سجل لهذا المستخدم في profiles.');return;}
                const admin=profile.role==='admin';
                if(!admin&&profile.status==='revoked'){renderAccessMessage('الحساب موقوف','تواصل مع الإدارة لإعادة التفعيل.');return;}
                if(!admin&&profile.status==='pending'){renderAccessMessage('الحساب في انتظار الموافقة','بعد الموافقة ستتمكن من الدخول.');return;}
                if(!admin&&(profile.must_change_credentials||profile.account_type==='temporary'||profile.is_temporary===true)){renderAccessMessage('الحساب مؤقت','ارجع للموقع من البداية وأكمل بيانات الحساب أولًا.');return;}
                if(!admin&&profile.must_change_password){renderAccessMessage('تغيير كلمة السر مطلوب','ارجع للموقع من البداية لتعيين كلمة سر جديدة قبل دخول الموقع.');return;}
                state.role=profile.role==='super_admin'?'super_admin':(admin?'admin':(profile.role==='moderator'?'moderator':'member'));
                state.user={id:profile.id||session.user.id, name:profile.full_name||profile.name||session.user.user_metadata?.full_name||'عضو',email:profile.email||session.user.email||'',phone:profile.phone_number||profile.phone||'',avatar:publicStorageUrl('avatars',profile.avatar_path||profile.avatar_url), profile_title:profile.profile_title||'', visible_titles:(profile.visible_titles!=null?profile.visible_titles:null), isOwnerAdmin:!!profile.is_owner_admin};
                const firstOpen=!profile.first_opened_at&&!profile.first_seen_at;
                void sb.rpc('record_user_open').then(()=>{},()=>{});
                await Promise.all([loadData(),loadPlatformManager(),loadWelcomeVideoCampaign()]);state.view='home';render();
                await new Promise(resolve=>showWelcomeVideoOnce(()=>{if(firstOpen) openModal('first-welcome',{});resolve();}));
                try{
                    const {data:messages,error:messagesError}=await sb.rpc('get_my_unread_messages');
                    if(!messagesError && Array.isArray(messages) && messages.length){
                        state.pendingUserMessages=messages;
                        if(state.user.phone && !state.modal){
                            openModal('user-message',{messages});
                            const ids=messages.map(x=>x.id).filter(Boolean);
                        }
                    }
                }catch(_){}
                if(!state.user.phone && !state.modal){
                    openModal('phone-required',{});
                }
            }catch(e){console.error(e);renderAccessMessage('تعذر تحميل المنصة',e.message||'خطأ غير معروف.');}
        }
        let explicitLogout=false;
        sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&explicitLogout)location.replace('../index.html');});



        console.log('المنصة · V11');
